name: Bug Report
description: Report a reproducible problem in KnowNote
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!

        Before submitting, please search existing issues to avoid duplicates.
        The more reproducible information you provide, the easier it is to investigate.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and did not find a duplicate.
          required: true
        - label: I am using a recent version of KnowNote.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence of steps that reproduces the problem.
      placeholder: |
        1. Open KnowNote
        2. Create/import ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KnowNote version
      placeholder: "e.g. v0.4.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x64
        - arm64
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Knowledge base
        - Document import / parsing
        - RAG / retrieval
        - AI / model connection
        - Notes / editor
        - Mind map
        - UI / UX
        - Database / storage
        - Desktop / packaging
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs or stack traces. Please remove API keys and other sensitive information.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, sample files, regression information, or anything else that may help.
