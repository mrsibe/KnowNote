appId: com.knownote.app
productName: KnowNote
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Native modules must live outside the asar so they can be loaded by dlopen()
# AND so electron-builder signs them individually. Keep these patterns explicit:
# if a native module stays inside app.asar it cannot be signed or loaded.
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/*.dylib'
  - node_modules/better-sqlite3/**
  - node_modules/sqlite-vec/**
  - node_modules/sqlite-vec-*/**
win:
  executableName: knownote
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  # Applied to the main binary; entitlementsInherit propagates the same set to
  # the Helper (GPU/Renderer/Plugin) processes. Both must point at the same
  # file, otherwise a helper can reject a library the main process accepted.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  # Do not let electron-builder run spctl during the build: an ad-hoc signed
  # build always fails that assessment and would abort packaging.
  gatekeeperAssess: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Notarization requires an Apple Developer ID (MACOS_CERTIFICATE +
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID secrets). Left off so
  # unsigned/community builds still ship; see .github/workflows/release.yml.
  notarize: false
dmg:
  # ${arch} is required: without it an arm64 and an x64 build both produce
  # `knownote-<version>.dmg` and silently clobber each other on the release.
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# Fail the build when the dependency collector cannot resolve a production
# dependency, instead of only logging a warning (which is the v26 default).
# A missed dependency is invisible at build time and only surfaces as
# MODULE_NOT_FOUND on a user's machine - exactly how v1.2.1 broke. Requires
# electron-builder >= 26.16.0. Missing *optional* dependencies (e.g. fsevents on
# Linux/Windows) are still allowed and never fail the build.
allowMissingDependencies: false
# `npmRebuild` is intentionally left at its default (true) so electron-builder
# rebuilds better-sqlite3 against the target Electron ABI and target
# architecture while packaging. Turning it off, as this project previously did,
# makes the shipped binary depend on whatever ABI `postinstall` happened to
# produce on the build host, which breaks cross-arch builds such as
# `build:mac --arm64`. The postinstall hook is kept for `dev`/`preview`.
# Published as a DRAFT: electron-builder uploads the artifacts, but the release
# only becomes public after every platform built and the macOS artifact passed
# the verification step in .github/workflows/release.yml.
publish:
  provider: github
  owner: MrSibe
  repo: KnowNote
  releaseType: draft
# NOTE: no electronDownload.mirror on purpose. Pulling the Electron runtime
# from a third-party mirror makes the shipped signature non-reproducible and
# can mix differently-signed Electron binaries into the bundle. Developers who
# need a mirror should set ELECTRON_MIRROR in their own environment instead.
